<!doctype html><html><head><meta charset="utf-8"><title>Slowreel Voices pack tests</title></head><body>
<pre id="log">running...</pre>
<script type="module">
// Voices pack tests (js/sound/vocals.js): format, every preset through the real engine offline (full + Light), formant
// positions per vowel (whispered = continuous spectrum, sung = harmonic envelope) with a nearest-vowel classification,
// solo legato glide, note-start cost, and a showcase phrase per instrument. Registers VOCALS at runtime like the integrator.
import { INSTRUMENTS, INSTRUMENT_MAP, resolveParams } from '../js/sound/instruments.js';
import { VOCALS, VOWELS } from '../js/sound/vocals.js';
import { createEngine } from '../js/sound/engine.js';
import { encodeWav } from '../lib/export.js';
import { noiseBuffer } from '../js/sound/util.js';
const noiseBufferWarm = c => ['white', 'pink', 'brown'].forEach(k => noiseBuffer(c, k));
for (const s of VOCALS) if (!INSTRUMENT_MAP[s.id]) { INSTRUMENTS.push(s); INSTRUMENT_MAP[s.id] = s; }
const db = x => (x <= 1e-9 ? -180 : 20 * Math.log10(x));
const r2 = x => Math.round(x * 100) / 100;
function analyse(buf, musicEndSec) {
  const sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  let pk = 0, ss = 0, nan = 0, clip = 0, dc = 0;
  for (let i = 0; i < n; i++) {
    const a = L[i], b = R[i];
    if (!Number.isFinite(a) || !Number.isFinite(b)) { nan++; continue; }
    const m = Math.max(Math.abs(a), Math.abs(b)); if (m > pk) pk = m; if (m >= 1) clip++;
    ss += a * a + b * b; dc += a + b;

  for (let s = 0; s + sr <= n; s += sr) { let e = 0; for (let i = s; i < s + sr; i++) e += L[i] * L[i] + R[i] * R[i]; win.push(Math.round(db(Math.sqrt(e / (2 * sr))) * 10) / 10); }
  const tail = win.slice(Math.min(win.length - 1, Math.ceil(musicEndSec)));
  let rises = 0; for (let i = 1; i < tail.length; i++) if (tail[i] > tail[i - 1] + 1.5 && tail[i] > -70) rises++;
  return { peakDb: r2(db(pk)), rmsDb: r2(db(Math.sqrt(ss / (2 * n)))), dc: r2(dc / (2 * n) * 1000), nan, clipped: clip, lastDb: tail[tail.length - 1], tailRises: rises };
}
const host = await createEngine({ context: new OfflineAudioContext(2, 128, 44100), songBaseUrl: '../audio/' });
const out = { meta: { instruments: VOCALS.length, presets: VOCALS.reduce((a, s) => a + s.presets.length, 0), engineSees: host.instruments.filter(i => VOCALS.some(a => a.id === i.id)).length },
  format: [], renders: [], light: [], formants: [], checks: {} };
const BPM = 80, N = (p, s, d, v = 0.8) => ({ p, s, d, v });
function oneTrack(instId, preset, notes, beats) {
  const p = host.newProject('t'); p.bpm = BPM; p.lengthBars = Math.ceil(beats / 4); p.master.atmosphere = 0.5;
  const t = host.newTrack({ instrument: instId, preset }); t.sends = { space: 0.4, echo: 0.1 }; t.fx = [];
  t.clips = [{ id: 'c', startBeat: 0, lengthBeats: beats, notes }]; p.tracks = [t]; return p;
}
// ---------------------------------------------------------------- format (same rules as the other packs)
for (const s of VOCALS) {
  const bad = [];
  if (!s.id || !s.name || typeof s.voice !== 'function' || !s.maxVoices || !s.kind) bad.push('shape');
  if (!(s.presets.length >= 3 && s.presets.length <= 5)) bad.push('presets ' + s.presets.length);
  if (!(s.macros.length >= 2 && s.macros.length <= 4)) bad.push('macros ' + s.macros.length);
  if (typeof s.prewarm !== 'function') bad.push('prewarm');
  const ids = s.params.map(p => p.id);
  for (const m of s.macros) { if (!ids.includes(m)) bad.push('macro ' + m); const mp = s.params.find(p => p.id === m); if (mp && mp.type === 'enum') bad.push('enum macro ' + m); }
  if (!ids.includes('level')) bad.push('no level');
  if (new Set(ids).size !== ids.length) bad.push('dup param');
  for (const p of s.params) {
    if (p.type === 'enum' && !(p.options || []).every(o => o && 'value' in o && 'label' in o)) bad.push('enum ' + p.id);
    if (p.type === 'enum' && !p.options.some(o => o.value === p.default)) bad.push('enum default ' + p.id);
    if (p.type !== 'enum' && !(p.default >= p.min && p.default <= p.max)) bad.push('range ' + p.id);
  }
  for (const pr of s.presets) for (const k in pr.params) {
    const d = s.params.find(p => p.id === k);
    if (!d) { bad.push(`preset ${pr.id}.${k}`); continue; }
    const val = pr.params[k];
    if (d.type === 'enum' ? !d.options.some(o => o.value === val) : !(val >= d.min && val <= d.max)) bad.push(`preset value ${pr.id}.${k}=${val}`);
  }
  if (new Set(s.presets.map(p => p.id)).size !== s.presets.length) bad.push('dup preset');
  const view = host.instruments.find(i => i.id === s.id);
  if (!view || view.macros.length !== s.macros.length) bad.push('engine view');
  out.format.push({ id: s.id, ok: !bad.length, bad });
}
const only = new URLSearchParams(location.search).get('only');
const save = async (buf, name) => (await fetch('/__save?name=' + name, { method: 'POST', body: encodeWav(buf, { bitDepth: 16 }) })).status;

function phrase(id) {
  if (id === 'femchoir') return { notes: [N(65, 0, 6), N(69, 0, 6, 0.75), N(72, 0, 6, 0.7), N(76, 0, 6, 0.65), N(62, 6, 6), N(65, 6, 6, 0.75), N(69, 6, 6, 0.7), N(74, 6, 6, 0.7)], beats: 12 };
  if (id === 'solovoice') return { notes: [N(72, 0, 2.1, 0.75), N(74, 2, 1.1, 0.7), N(76, 3, 2.1, 0.85), N(79, 5, 1.05, 0.8), N(77, 6, 3, 0.75), N(72, 10, 2, 0.6)], beats: 12 };
  if (id === 'vocalchops') {
    const ns = [], pat = [[72, 0], [75, 0.75], [79, 1.5], [77, 2], [75, 2.75], [72, 3.5], [70, 4], [72, 4.75], [75, 5.5], [79, 6]];
    for (const [p, s] of pat) ns.push(N(p, s, 0.45, 0.8));
    ns.push(N(84, 6.5, 1.5, 0.75)); return { notes: ns, beats: 8 };
  }
  if (id === 'breathvox') return { notes: [N(60, 0, 8, 0.8), N(67, 4, 6, 0.7)], beats: 10 };
  return { notes: [N(72, 0, 8), N(76, 0, 8, 0.75), N(79, 0, 8, 0.7), N(83, 0, 8, 0.65)], beats: 9 };
}
const music = ph => ph.beats * 60 / BPM;
if (!only || only === 'presets') {
  for (const s of VOCALS) {
    const ph = phrase(s.id);
    for (const pr of s.presets) {
      const t0 = performance.now();
      const buf = await host.render(oneTrack(s.id, pr.id, ph.notes, ph.beats), { tailSeconds: 10 });
      const ms = performance.now() - t0;
      const row = { inst: s.id, preset: pr.id, ms: Math.round(ms), rtf: r2(buf.duration / (ms / 1000)), stats: host.lastRenderStats, ...analyse(buf, music(ph) + 1) };
      row.saved = await save(buf, `vocals-${s.id}-${pr.id}.wav`);
      out.renders.push(row);
    }
    const lb = await host.render(oneTrack(s.id, s.presets[0].id, ph.notes, ph.beats), { tailSeconds: 10, light: true });
    out.light.push({ inst: s.id, ...analyse(lb, music(ph) + 1), stats: host.lastRenderStats, fullNodes: out.renders.find(r => r.inst === s.id).stats.maxNodes });
  }
}
// ---------------------------------------------------------------- direct voice renders
async function direct(id, params, notes, seconds, light = false) {
  const def = INSTRUMENT_MAP[id], sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
  const P = { ...resolveParams(id, def.presets[0].id, {}), ...params };
  def.prewarm?.(ctx, P, 60);
  const env = { light, voiceEnded() { } };
  for (const n of notes) { const v = def.voice(ctx, env, P, n.p, n.v ?? 0.8, n.t); v.out.connect(ctx.destination); v.release(n.t + n.d); }
  return ctx.startRendering();
}
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < len / 2; k++) {
      const ur = re[i + k], ui = im[i + k], xr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, xi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
      re[i + k] = ur + xr; im[i + k] = ui + xi; re[i + k + len / 2] = ur - xr; im[i + k + len / 2] = ui - xi;
      const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } }
  }
}
// Welch power spectrum of the mono sum between t0 and t1 (8192-point Hann frames)
function spectrum(buf, t0, t1, M = 8192) {
  const sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.getChannelData(1), P = new Float64Array(M / 2);
  let frames = 0;
  for (let s = Math.round(t0 * sr); s + M <= Math.round(t1 * sr); s += M / 2) {
    const re = new Float64Array(M), im = new Float64Array(M);
    for (let i = 0; i < M; i++) re[i] = (L[s + i] + R[s + i]) * 0.5 * Math.sin(Math.PI * i / (M - 1)) ** 2;
    fft(re, im); for (let k = 0; k < M / 2; k++) P[k] += re[k] * re[k] + im[k] * im[k]; frames++;

}
// smoothed dB envelope (whisper: running mean over ~60 Hz; sung: harmonic peaks, interpolated)
function envWhisper({ P, df }) { const w = Math.round(30 / df), e = []; for (let k = 0; k < P.length; k++) { let s = 0, c = 0; for (let j = Math.max(0, k - w); j <= Math.min(P.length - 1, k + w); j++) { s += P[j]; c++; } e.push(db(Math.sqrt(s / c) + 1e-12)); } return e; }
// sung: harmonic amplitudes divided by the glottal source (h^-tilt, H1 boost) = the vocal tract response, interpolated
function envSung({ P, df }, f0, tilt = 1.35, h1 = 1.2) {
  const H = []; for (let h = 1; h * f0 < 6000; h++) { const k = Math.round(h * f0 / df); let m = 0; for (let j = k - 3; j <= k + 3; j++) m = Math.max(m, P[j]); H.push([h * f0, db(Math.sqrt(m) + 1e-12) - db((h === 1 ? h1 : 1) * Math.pow(h, -tilt))]); }
  const e = []; for (let k = 0; k < P.length; k++) { const f = k * df; let i = H.findIndex(x => x[0] >= f); if (i <= 0) { e.push(i === 0 ? H[0][1] : H[H.length - 1][1]); continue; } const [fa, a] = H[i - 1], [fb, b] = H[i]; e.push(a + (b - a) * (f - fa) / (fb - fa)); }

}
// the highest LOCAL maximum in [lo, hi] (falls back to the plain maximum)
const peakIn = (e, df, lo, hi) => { let best = -1, bv = -1e9, mb = -1, mv = -1e9; for (let k = Math.round(lo / df); k <= Math.round(hi / df); k++) { if (e[k] > mv) { mv = e[k]; mb = k; } if (e[k] > bv && e[k] >= e[k - 1] && e[k] > e[k + 1] && e[k] >= e[k - 4] && e[k] >= e[k + 4]) { bv = e[k]; best = k; } } return best < 0 ? [mb * df, mv] : [best * df, bv]; };
// F1 = strongest peak in 200-1100 Hz; F2 = strongest peak above F1 (+250 Hz) up to 3100 Hz, excluding F1's own skirt
function formantsOf(e, df) {
  const [f1, l1] = peakIn(e, df, 200, 1100);
  const [f2, l2] = peakIn(e, df, Math.max(f1 + 250, 700), 3100);
  return { f1: Math.round(f1), f2: Math.round(f2), l1: r2(l1), l2: r2(l2) };
}
const ORAL = ['ooh', 'oh', 'aah', 'eh', 'ee'];
const classify = (f1, f2) => ORAL.map(k => [k, Math.hypot(Math.log(f1 / VOWELS[k].F[0]) * 1.3, Math.log(f2 / VOWELS[k].F[1]))]).sort((a, b) => a[1] - b[1])[0][0];
const VX = { mm: 0, ooh: 0.2, oh: 0.4, aah: 0.6, eh: 0.8, ee: 1 };
if (!only || only === 'checks') {
  // whispered vowels: noise through the tract shows its formants as a continuous spectrum
  for (const k of Object.keys(VX)) {
    const b = await direct('breathvox', { vowel: VX[k], voice: 0, motion: 0, air: 0, shape: 'pad', formant: 0, swell: 0 }, [{ p: 60, t: 0, d: 3 }], 3.2);
    const fm = formantsOf(envWhisper(spectrum(b, 0.8, 2.9)), 44100 / 8192);
    out.formants.push({ kind: 'whisper', vowel: k, ...fm, want: VOWELS[k].F.slice(0, 2), cls: k === 'mm' ? '-' : classify(fm.f1, fm.f2) });
  }
  // sung vowels: Female Choir (no motion / vibrato / breath), real glottal source, played at A2 (110 Hz) so the harmonics
  // are dense enough to locate F1 and F2 from the harmonic envelope (divided by the source spectrum)
  for (const k of Object.keys(VX)) {
    const b = await direct('femchoir', { vowel: VX[k], motion: 0, breath: 0, vibrato: 0, open: 0, swell: 0, ensemble: 0, section: 'soprano' }, [{ p: 45, t: 0, d: 3 }], 3.2);
    const fm = formantsOf(envSung(spectrum(b, 0.8, 2.9), 110, 1.05), 44100 / 8192);
    out.formants.push({ kind: 'sung', vowel: k, ...fm, want: VOWELS[k].F.slice(0, 2), cls: k === 'mm' ? '-' : classify(fm.f1, fm.f2) });
  }
  // the same vowel at a soprano pitch keeps its F2 (ooh vs ee vs aah stay apart at E5)
  // at E5 (659 Hz) the harmonics are too sparse to locate formants; instead check the levels of H2 (1318 Hz) and H4
  // (2637 Hz) against H1: aah has the most H2 (F1/F2 near it), ee by far the most H4 (F2/F3 there), ooh the least of both
  out.checks.soprano = {};
  for (const k of ['ooh', 'aah', 'ee']) {
    const b = await direct('solovoice', { vowel: VX[k], breath: 0, vibrato: 0, glide: 0, swell: 0, fall: 0, formant: 0 }, [{ p: 76, t: 0, d: 3 }], 3.2);
    const { P, df } = spectrum(b, 0.8, 2.9), lv = h => { const c = Math.round(h * 659.26 / df); let m = 0; for (let j = c - 3; j <= c + 3; j++) m = Math.max(m, P[j]); return db(Math.sqrt(m)); };
    out.checks.soprano[k] = { h2: r2(lv(2) - lv(1)), h4: r2(lv(4) - lv(1)) };
  }
  // legato glide on the solo voice: pitch half-way through the glide sits between the two notes
  {
    const b = await direct('solovoice', { glide: 0.6, vibrato: 0, breath: 0.1, fall: 0 }, [{ p: 67, t: 0.05, d: 1.05 }, { p: 72, t: 1.0, d: 1.5 }], 3);
    const yin = (t0) => {   // YIN: cumulative-mean-normalised difference, first dip under 0.15, parabolic interpolation
      const sr = 44100, x = b.getChannelData(0), s = Math.round(t0 * sr), W = 1600, d = new Float64Array(402), dn = new Float64Array(402); let run = 0; dn[0] = 1;
      for (let lag = 1; lag <= 401; lag++) { let e = 0; for (let i = 0; i < W; i++) { const q = x[s + i] - x[s + i + lag]; e += q * q; } d[lag] = e; run += e; dn[lag] = e * lag / (run || 1); }
      let best = -1; for (let lag = 40; lag < 400; lag++) if (dn[lag] < 0.15 && dn[lag] <= dn[lag - 1] && dn[lag] <= dn[lag + 1]) { best = lag; break; }
      if (best < 0) { let m = 9; for (let lag = 40; lag < 400; lag++) if (dn[lag] < m) { m = dn[lag]; best = lag; } }
      const a = dn[best - 1], c = dn[best + 1], den = a - 2 * dn[best] + c, off = den ? 0.5 * (a - c) / den : 0;

  }
  // cost of starting a note (what play() / the scheduler pay): ms per voice() call, full and Light
  out.checks.noteStartMs = {};
  for (const s of [...VOCALS, INSTRUMENT_MAP.strings, INSTRUMENT_MAP.tapepad]) for (const light of [false, true]) {
    const ctx = new OfflineAudioContext(2, 44100, 44100), P = resolveParams(s.id, s.presets[0].id, {}), env = { light, voiceEnded() { } };
    s.prewarm?.(ctx, P, 60); for (let i = 0; i < 12; i++) s.voice(ctx, env, P, 60 + i, 0.8, 0);   // warm (JIT, level maths)

    const c2 = new OfflineAudioContext(2, 44100, 44100); s.prewarm?.(c2, P, 60); noiseBufferWarm(c2);
    for (let r = 0; r < 5; r++) {   // best of 5 runs of 12 notes (GC pauses from the renders above are not the voice's cost)
      const t0 = performance.now(); for (let i = 0; i < 12; i++) nodes = s.voice(c2, env, P, 60 + i, 0.8, 0.01 * i).nodes.length; runs.push((performance.now() - t0) / 12); }

  }

  add('femchoir', 'ooh-choir', 0, [N(57, 0, 8, 0.7), N(64, 0, 8, 0.65), N(69, 0, 8, 0.65), N(72, 0, 8, 0.6), N(55, 8, 4, 0.7), N(62, 8, 4, 0.65), N(67, 8, 4, 0.65), N(71, 8, 4, 0.6)]);
  add('solovoice', 'breathy-lead', 12, [N(76, 0, 1.6, 0.75), N(79, 1.5, 1.1, 0.75), N(81, 2.5, 2.6, 0.85), N(79, 5, 1.1, 0.7), N(76, 6, 3, 0.75)]);
  add('femchoir', 'hum-choir', 12, [N(57, 0, 9, 0.55), N(64, 0, 9, 0.5), N(69, 0, 9, 0.5)], { space: 0.5, echo: 0 });
  const chops = []; [[76, 0], [79, 0.75], [81, 1.5], [79, 2.5], [76, 3], [74, 3.75], [76, 4.5], [83, 5.25], [81, 6]].forEach(([q, s]) => chops.push(N(q, s, 0.4, 0.8)));

  add('vocalchops', 'reverse-chop', 33, [N(76, 0, 1, 0.8)], { space: 0.6, echo: 0.2 });

window.__result = out;
document.getElementById('log').textContent = 'done';
