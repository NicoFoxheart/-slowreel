<!doctype html><html><head><meta charset="utf8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
// Test page: renders single heart frames for screenshots. ?w=&h=&t=&mood=&pulse=&accent=&title=
import { loadHeart } from '../js/visual/common.js';
const { createHeartScene } = await loadHeart();
import { idleFeatures } from '../js/visual/features.js';
const q = new URLSearchParams(location.search), w = +q.get('w') || 540, h = +q.get('h') || 960;
const sc = createHeartScene({ width: w, height: h, mood: q.get('mood') || 'sakura', intensity: +(q.get('i') ?? 0.6), title: q.get('title') ?? 'After the Storm', light: q.get('light') === '1', preserve: true, antialias: q.get('aa') !== '0' });
document.body.append(sc.canvas); sc.canvas.style.width = w + 'px';
for (const k of (q.get('hide') || '').split(',').filter(Boolean)) { if (k === 'bloom') sc._parts.postU.uBloom.value = 0; else sc._parts[k].visible = false; }
window.draw = (t, over = {}) => { const f = { ...idleFeatures(t), ...over }; sc.render(t, f, { duration: 60 }); return true; };
window.draw(+q.get('t') || 7, { pulse: +(q.get('pulse') ?? .4), accent: +(q.get('accent') ?? 0) });
window.ready = true;
</script></body></html>
