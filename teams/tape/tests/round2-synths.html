<!doctype html><html><head><meta charset="utf-8"><title>Slowreel round 2 synth tests</title></head><body>
<pre id="log">running...</pre>
<script type="module">
// Round 2 SYNTHS lane tests: every synth preset rendered offline through the real engine, arp unit checks, an arp render,
// and the live arp against a real AudioContext. Registers SYNTHS at runtime the same way the integrator will.
import { INSTRUMENTS, INSTRUMENT_MAP } from '../js/sound/instruments.js';
import { SYNTHS } from '../js/sound/synths.js';
import { arpProcess, arpNotes, createLiveArp, ARP_PARAMS, ARP_RATES } from '../js/sound/arp.js';
import { createEngine } from '../js/sound/engine.js';
import { encodeWav } from '../lib/export.js';
for (const s of SYNTHS) if (!INSTRUMENT_MAP[s.id]) { INSTRUMENTS.push(s); INSTRUMENT_MAP[s.id] = s; }
const log = s => { document.getElementById('log').textContent += '\n' + s; };
const db = x => (x <= 1e-9 ? -180 : 20 * Math.log10(x));
const r2 = x => Math.round(x * 100) / 100;
function analyse(buf, musicEndSec) {
  const sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  let pk = 0, ss = 0, nan = 0, clip = 0, dc = 0;
  for (let i = 0; i < n; i++) {
    const a = L[i], b = R[i];
    if (!Number.isFinite(a) || !Number.isFinite(b)) { nan++; continue; }
    const m = Math.max(Math.abs(a), Math.abs(b)); if (m > pk) pk = m; if (m >= 1) clip++;
    ss += a * a + b * b; dc += a + b;
  }
  const win = [];
  for (let s = 0; s + sr <= n; s += sr) { let e = 0; for (let i = s; i < s + sr; i++) e += L[i] * L[i] + R[i] * R[i]; win.push(Math.round(db(Math.sqrt(e / (2 * sr))) * 10) / 10); }
  const tail = win.slice(Math.min(win.length - 1, Math.floor(musicEndSec)));
  let rises = 0; for (let i = 1; i < tail.length; i++) if (tail[i] > tail[i - 1] + 1.5) rises++;
  return { peakDb: r2(db(pk)), rmsDb: r2(db(Math.sqrt(ss / (2 * n)))), dc: r2(dc / (2 * n) * 1000), nan, clipped: clip, lastDb: tail[tail.length - 1], tailRises: rises };
}
const host = await createEngine({ context: new OfflineAudioContext(2, 128, 44100), songBaseUrl: '../audio/' });
const out = { meta: { synths: SYNTHS.length, presets: SYNTHS.reduce((a, s) => a + s.presets.length, 0), engineSees: host.instruments.filter(i => SYNTH_IDS().includes(i.id)).length }, format: [], synths: [], arp: {}, errors: [] };
function SYNTH_IDS() { return SYNTHS.map(s => s.id); }
function oneTrack(instId, preset, notes, beats, bpm = 100) {
  const p = host.newProject('t'); p.bpm = bpm; p.lengthBars = Math.ceil(beats / 4); p.master.atmosphere = 0.5;
  const t = host.newTrack({ instrument: instId, preset }); t.sends = { space: 0.35, echo: 0.1 }; t.fx = [];
  t.clips = [{ id: 'c', startBeat: 0, lengthBeats: beats, notes }]; p.tracks = [t]; return p;
}
// format checks: same definition shape as instruments.js so the panels need no special cases
for (const s of SYNTHS) {
  const bad = [];
  if (!s.id || !s.name || typeof s.voice !== 'function' || !s.maxVoices) bad.push('shape');
  if (!(s.presets.length >= 3 && s.presets.length <= 5)) bad.push('presets ' + s.presets.length);
  if (!(s.macros.length >= 2 && s.macros.length <= 4)) bad.push('macros ' + s.macros.length);
  const ids = s.params.map(p => p.id);
  for (const m of s.macros) if (!ids.includes(m)) bad.push('macro ' + m);
  if (!ids.includes('level')) bad.push('no level');
  for (const p of s.params) {
    if (p.type === 'enum' && !(p.options || []).every(o => o && 'value' in o && 'label' in o)) bad.push('enum ' + p.id);
    if (p.type === 'enum' && !p.options.some(o => o.value === p.default)) bad.push('enum default ' + p.id);
    if (p.type !== 'enum' && !(p.default >= p.min && p.default <= p.max)) bad.push('range ' + p.id);
  }
  for (const pr of s.presets) for (const k in pr.params) if (!ids.includes(k)) bad.push(`preset ${pr.id}.${k}`);
  const view = host.instruments.find(i => i.id === s.id);
  if (!view || !view.macros.length) bad.push('engine view');
  out.format.push({ id: s.id, ok: !bad.length, bad });
}
const only = new URLSearchParams(location.search).get('only');
const save = async (buf, name) => (await fetch('/__save?name=' + name, { method: 'POST', body: encodeWav(buf, { bitDepth: 16 }) })).status;
if (!only || only === 'presets') {
  const poly = [{ p: 57, s: 0, d: 3, v: 0.8 }, { p: 64, s: 0, d: 3, v: 0.7 }, { p: 69, s: 0.5, d: 2.5, v: 0.9 }, { p: 72, s: 1, d: 2, v: 0.8 },
    { p: 76, s: 2, d: 2, v: 1 }, { p: 45, s: 2, d: 2, v: 1 }, { p: 60, s: 4, d: 0.5, v: 0.9 }, { p: 64, s: 4.5, d: 0.5, v: 0.9 }, { p: 67, s: 5, d: 0.5, v: 1 }];
  // mono line with legato overlaps (glide) and separated notes
  const mono = [{ p: 62, s: 0, d: 1.1, v: 0.8 }, { p: 69, s: 1, d: 1.1, v: 0.9 }, { p: 67, s: 2, d: 0.5, v: 0.7 }, { p: 74, s: 3, d: 1.6, v: 1 }, { p: 57, s: 4.5, d: 1.5, v: 0.9 }];
  for (const s of SYNTHS) {
    for (const pr of s.presets) {
      let notes = s.maxVoices <= 2 ? mono : poly;
      if (s.id === 'synthbass') notes = notes.map(n => ({ ...n, p: n.p - 24 }));
      const t0 = performance.now();
      const buf = await host.render(oneTrack(s.id, pr.id, notes, 6), { tailSeconds: 7 });
      const a = analyse(buf, 6 * 0.6);
      const row = { inst: s.id, preset: pr.id, ms: Math.round(performance.now() - t0), stats: host.lastRenderStats, ...a };
      if (pr === s.presets[0]) row.saved = await save(buf, `round2-synth-${s.id}.wav`);
      out.synths.push(row);
    }
  }
  // stress: 8-note chords on the biggest pad, fast repeats, must respect the voice cap
  const stress = []; for (let k = 0; k < 16; k++) for (let j = 0; j < 8; j++) stress.push({ p: 48 + j * 4, s: k * 0.25, d: 0.4, v: 1 });
  const sb = await host.render(oneTrack('supersaw', 'dream-pad', stress, 4, 120), { tailSeconds: 6 });
  out.stress = { ...analyse(sb, 2), stats: host.lastRenderStats };
  await host.render(oneTrack('felt', 'felt-upright', stress, 4, 120), { tailSeconds: 6 });   // same stress on a round-1 instrument: the engine's own voice accounting
  out.stress.feltMaxVoices = host.lastRenderStats.maxVoices;
}
if (!only || only === 'arp') {
  const A = out.arp, chord = [{ p: 60, s: 0, d: 4, v: 0.8 }, { p: 64, s: 0, d: 4, v: 0.7 }, { p: 67, s: 0, d: 4, v: 0.9 }];
  const up = arpProcess(chord, { on: 1, rate: '1/16', pattern: 'up', octaves: 1 }, 120);
  A.up = { n: up.length, first: up.slice(0, 4).map(n => n.p).join(','), step: up[1].s - up[0].s, d: up[0].d };
  A.down = arpProcess(chord, { on: 1, rate: '1/8', pattern: 'down' }, 120).slice(0, 4).map(n => n.p).join(',');
  A.updown = arpProcess(chord, { on: 1, rate: '1/16', pattern: 'updown', octaves: 2 }, 120).slice(0, 11).map(n => n.p).join(',');
  const played = [{ p: 67, s: 0, d: 2, v: 0.8 }, { p: 60, s: 0.01, d: 2, v: 0.8 }, { p: 64, s: 0.02, d: 2, v: 0.8 }];
  A.played = arpProcess(played, { on: 1, rate: '1/8', pattern: 'played' }, 120).slice(0, 3).map(n => n.p).join(',');
  const r1 = arpProcess(chord, { on: 1, pattern: 'random', octaves: 2 }, 120), rB = arpProcess(chord, { on: 1, pattern: 'random', octaves: 2 }, 120);
  A.random = { n: r1.length, distinct: new Set(r1.map(n => n.p)).size, deterministic: JSON.stringify(r1) === JSON.stringify(rB) };
  A.oct4 = Math.max(...arpProcess(chord, { on: 1, octaves: 4 }, 120).map(n => n.p));
  A.trip = arpProcess(chord, { on: 1, rate: '1/8T' }, 120).length;
  A.t32 = arpProcess(chord, { on: 1, rate: '1/32' }, 120).length;
  const sw = arpProcess(chord, { on: 1, rate: '1/16', swing: 0.5 }, 120); A.swing = [sw[0].s, sw[1].s, sw[2].s];
  A.gate = arpProcess(chord, { on: 1, rate: '1/8', gate: 0.25 }, 120)[0].d;
  A.off = arpProcess(chord, { on: 0 }, 120) === chord;
  A.clipLen = Math.max(...arpProcess(chord, { on: 1 }, 120, 2).map(n => n.s + n.d));
  A.gap = arpProcess([{ p: 60, s: 0, d: 1, v: 1 }, { p: 72, s: 2, d: 1, v: 1 }], { on: 1, rate: '1/4' }, 120).map(n => n.s).join(',');
  const clip = { notes: chord, lengthBeats: 4 }; A.memo = arpNotes(clip, { on: 1 }, 120) === arpNotes(clip, { on: 1 }, 120);
  A.paramsOk = ARP_PARAMS.every(p => p.id && p.name && (p.type !== 'enum' || p.options.every(o => 'value' in o && 'label' in o))) && Object.keys(ARP_RATES).length === 6;
  // render: arp through the engine (the integrator calls arpNotes in the scheduler; here the clip notes are pre-processed)
  const notes = arpProcess([{ p: 57, s: 0, d: 8, v: 0.8 }, { p: 60, s: 0, d: 8, v: 0.8 }, { p: 64, s: 0, d: 8, v: 0.8 }, { p: 69, s: 4, d: 4, v: 0.9 }],
    { on: 1, rate: '1/16', pattern: 'updown', octaves: 2, gate: 0.5, swing: 0.3 }, 124);
  const buf = await host.render(oneTrack('synthpluck', 'garage-pluck', notes, 8, 124), { tailSeconds: 5 });
  A.render = { notes: notes.length, ...analyse(buf, 4), stats: host.lastRenderStats, saved: await save(buf, 'round2-synth-arp.wav') };
  // live arp on a real AudioContext against the real engine
  const ctx = new AudioContext(); await ctx.resume();
  const eng = await createEngine({ context: ctx, songBaseUrl: '../audio/' });
  const proj = oneTrack('synthpluck', 'garage-pluck', [], 4, 120); proj.tracks[0].id = 'pl'; await eng.load(proj);
  const ons = [], offs = [];
  const wrap = { context: ctx, position: () => eng.position(), noteOn: (id, m, v) => { ons.push([ctx.currentTime, m]); eng.noteOn(id, m, v); }, noteOff: (id, m) => { offs.push(m); eng.noteOff(id, m); } };
  const arp = createLiveArp(wrap, 'pl', () => ({ on: 1, rate: '1/16', pattern: 'up', octaves: 2, gate: 0.5 }), () => 120);
  arp.noteOn(60, 0.8); arp.noteOn(64, 0.8); arp.noteOn(67, 0.8);
  await new Promise(r => setTimeout(r, 1000));
  const meter = eng.meter('pl');
  arp.noteOff(60); arp.noteOff(64); arp.noteOff(67);
  await new Promise(r => setTimeout(r, 300));
  const gaps = ons.slice(1).map((o, i) => o[0] - ons[i][0]);
  A.live = { active: arp.active(), ons: ons.length, offs: offs.length, notes: ons.slice(0, 7).map(o => o[1]).join(','), meanGapMs: Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length * 1000),
    maxJitterMs: Math.round(Math.max(...gaps.map(g => Math.abs(g - 0.125))) * 1000), meterDb: Math.round(meter.peakDb), voicesAfter: eng.stats().voices };
  arp.dispose(); eng.dispose(); ctx.close();
}
window.__result = out;
log('done');
</script></body></html>
