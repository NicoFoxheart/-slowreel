<!doctype html><html><head><meta charset="utf-8"><title>Slowreel East Asian pack tests</title></head><body>
<pre id="log">running...</pre>
<script type="module">
// East Asian pack tests (js/sound/asian.js): format + scales, every preset rendered offline through the real engine
// (full and Light mode), then direct voice renders for tuning, gestures (oshide, meri, slides), pipa tremolo rate,
// drum maps and the wind-chime texture. Registers ASIAN at runtime the same way the integrator will.
import { INSTRUMENTS, INSTRUMENT_MAP, resolveParams } from '../js/sound/instruments.js';
import { ASIAN, ASIAN_SCALES } from '../js/sound/asian.js';
import { createEngine } from '../js/sound/engine.js';
import { encodeWav } from '../lib/export.js';
for (const s of ASIAN) if (!INSTRUMENT_MAP[s.id]) { INSTRUMENTS.push(s); INSTRUMENT_MAP[s.id] = s; }
const log = s => { document.getElementById('log').textContent += '\n' + s; };
const db = x => (x <= 1e-9 ? -180 : 20 * Math.log10(x));
const r2 = x => Math.round(x * 100) / 100;
function analyse(buf, musicEndSec) {
  const sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  let pk = 0, ss = 0, nan = 0, clip = 0, dc = 0;
  for (let i = 0; i < n; i++) {

const host = await createEngine({ context: new OfflineAudioContext(2, 128, 44100), songBaseUrl: '../audio/' });

  const t = host.newTrack({ instrument: instId, preset }); t.sends = { space: 0.35, echo: instId === 'windchimes' ? 0 : 0.1 }; t.fx = [];

// ---------------------------------------------------------------- format
for (const s of ASIAN) {

  if (!(s.presets.length >= 3 && s.presets.length <= 4)) bad.push('presets ' + s.presets.length);
  if (!(s.macros.length >= 2 && s.macros.length <= 4)) bad.push('macros ' + s.macros.length);

  if (new Set(ids).size !== ids.length) bad.push('dup param');
  for (const p of s.params) {
    if (p.type === 'enum' && !(p.options || []).every(o => o && 'value' in o && 'label' in o)) bad.push('enum ' + p.id);
    if (p.type === 'enum' && !p.options.some(o => o.value === p.default)) bad.push('enum default ' + p.id);
    if (p.type !== 'enum' && !(p.default >= p.min && p.default <= p.max)) bad.push('range ' + p.id);
  }
  for (const pr of s.presets) for (const k in pr.params) {
    const d = s.params.find(p => p.id === k);
    if (!d) { bad.push(`preset ${pr.id}.${k}`); continue; }
    const val = pr.params[k];
    if (d.type === 'enum' ? !d.options.some(o => o.value === val) : !(val >= d.min && val <= d.max)) bad.push(`preset value ${pr.id}.${k}=${val}`);
  }

  const view = host.instruments.find(i => i.id === s.id);

}
{
  const want = ['pyeongjo', 'gyemyeonjo', 'gong', 'shang', 'jue', 'zhi', 'yu', 'hirajoshi', 'in', 'yo', 'iwato', 'kumoi', 'ryukyu'];
  const ok = want.every(id => ASIAN_SCALES.some(s => s.id === id)) && ASIAN_SCALES.every(s => s.name && s.region && Array.isArray(s.intervals) && s.intervals[0] === 0 &&
    s.intervals.every((x, i) => Number.isInteger(x) && x >= 0 && x < 12 && (i === 0 || x > s.intervals[i - 1])) && Object.keys(s).sort().join() === 'id,intervals,name,region');
  out.scales = { ok, n: ASIAN_SCALES.length, list: ASIAN_SCALES.map(s => `${s.id}:${s.intervals.join(' ')}`).join(' | ') };
}
const only = new URLSearchParams(location.search).get('only');
const save = async (buf, name) => (await fetch('/__save?name=' + name, { method: 'POST', body: encodeWav(buf, { bitDepth: 16 }) })).status;

// ---------------------------------------------------------------- phrases per family (in beats, 90 BPM)
const N = (p, s, d, v = 0.8) => ({ p, s, d, v });
const FAMILY = {
  pluck: ['gayageum', 'guzheng', 'koto', 'pipa', 'shamisen'], bowed: ['haegeum', 'erhu'], flute: ['daegeum', 'dizi', 'shakuhachi'],
  drums: ['janggu', 'taiko'], bells: ['templebells'], texture: ['windchimes'],

const familyOf = id => Object.keys(FAMILY).find(k => FAMILY[k].includes(id));
function phrase(id) {

    const ns = [N(62, 0, 1, 0.8), N(64, 1, 0.5, 0.7), N(67, 1.5, 0.5, 0.75), N(69, 2, 2, 0.9), N(50, 2, 3, 0.85)];
    [62, 64, 67, 69, 71, 74, 76, 79].forEach((p, i) => ns.push(N(p, 4.5 + i * 0.09, 1.5 - i * 0.09, 0.55 + i * 0.04)));

    const ns = [N(62, 0, 1.1, 0.7), N(64, 1, 1.1, 0.8), N(69, 2, 1.6, 0.95), N(67, 4, 0.8, 0.6), N(62, 5, 2.5, 0.85)].map(n => ({ ...n, p: n.p + lo }));

  if (fam === 'drums') {
    const ns = [];
    const pat = [[36, 0, 1], [38, 0.5, 0.7], [39, 0.75, 0.5], [37, 1, 0.9], [38, 1.5, 0.8], [36, 2, 0.8], [40, 2.5, 0.8], [38, 3.25, 0.6], [37, 3.5, 1], [36, 4, 0.9], [39, 4.5, 0.6], [38, 5, 0.9], [40, 5.5, 0.7], [37, 6, 1]];
    for (const [p, s, v] of pat) ns.push(N(p, s, 0.25, v));

  }

}

  for (const s of ASIAN) {
    const ph = phrase(s.id);
    for (const pr of s.presets) {
      const t0 = performance.now();
      const buf = await host.render(oneTrack(s.id, pr.id, ph.notes, ph.beats), { tailSeconds: ph.tail || 9 });
      const ms = performance.now() - t0, musicEnd = ph.beats * 60 / 90;
      const a = analyse(buf, musicEnd + (familyOf(s.id) === 'pluck' ? 1 : 0));
      const row = { inst: s.id, preset: pr.id, ms: Math.round(ms), rtf: r2(buf.duration / (ms / 1000)), stats: host.lastRenderStats, ...a };
      if (pr === s.presets[0]) row.saved = await save(buf, `asian-${s.id}.wav`);
      out.renders.push(row);
    }
    // Light mode: first preset, same phrase
    const lb = await host.render(oneTrack(s.id, s.presets[0].id, ph.notes, ph.beats), { tailSeconds: ph.tail || 9, light: true });
    out.light.push({ inst: s.id, ...analyse(lb, ph.beats * 60 / 90 + 1), stats: host.lastRenderStats, fullNodes: out.renders.find(r => r.inst === s.id).stats.maxNodes });
  }
  // a family showcase: one short phrase per family for the spectrograms (Korean / Chinese / Japanese sets)
  for (const [name, ids] of [['korean', ['gayageum', 'haegeum', 'daegeum', 'janggu']], ['chinese', ['templebells', 'guzheng', 'erhu', 'dizi', 'pipa']], ['japanese', ['koto', 'shakuhachi', 'shamisen', 'taiko', 'windchimes']]]) {
    const p = host.newProject(name); p.bpm = 90;
    let beat = 0;
    for (const id of ids) {
      const ph = phrase(id), t = host.newTrack({ instrument: id }); t.sends = { space: 0.4, echo: 0.08 };
      const len = Math.min(ph.beats, 8);
      t.clips = [{ id: 'c' + id, startBeat: beat, lengthBeats: len, notes: ph.notes.filter(n => n.s < len).map(n => ({ ...n, d: Math.min(n.d, len - n.s) })) }];
      p.tracks.push(t); beat += len;
    }
    p.lengthBars = Math.ceil(beat / 4);
    const buf = await host.render(p, { tailSeconds: 8 });
    out.checks['family-' + name] = { ...analyse(buf, beat * 60 / 90 + 2), stats: host.lastRenderStats, saved: await save(buf, `asian-family-${name}.wav`) };
  }
}

// ---------------------------------------------------------------- direct voice renders (no engine, no room)
async function direct(id, params, notes, seconds, light = false) {
  const def = INSTRUMENT_MAP[id], sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
  const P = { ...resolveParams(id, def.presets[0].id, {}), ...params };
  const env = { light, voiceEnded() { } };
  const voices = [];
  for (const n of notes) {
    const v = def.voice(ctx, env, P, n.p, n.v ?? 0.8, n.t);
    v.out.connect(ctx.destination); v.release(n.t + n.d);
    if (v.tick) { v.tick(n.t + n.d); v.tick(n.t + n.d); }
    voices.push(v);
  }
  const buf = await ctx.startRendering();
  return { buf, voices };
}
// pitch (Hz) of a mono window by normalised autocorrelation (YIN-style difference), parabolic interpolation
function pitchAt(buf, t0, win = 0.09, fmin = 60, fmax = 1500) {
  const sr = buf.sampleRate, x = buf.getChannelData(0), s = Math.round(t0 * sr), W = Math.round(win * sr);
  const maxLag = Math.round(sr / fmin), minLag = Math.round(sr / fmax), d = new Float64Array(maxLag + 2);
  for (let lag = 1; lag <= maxLag + 1; lag++) { let e = 0; for (let i = 0; i < W; i++) { const a = x[s + i] - x[s + i + lag]; e += a * a; } d[lag] = e; }
  let run = 0; const dn = new Float64Array(maxLag + 2); dn[0] = 1;
  for (let lag = 1; lag <= maxLag + 1; lag++) { run += d[lag]; dn[lag] = d[lag] * lag / (run || 1); }
  let best = -1;
  for (let lag = minLag; lag <= maxLag; lag++) if (dn[lag] < 0.2 && dn[lag] < dn[lag - 1] && dn[lag] <= dn[lag + 1]) { best = lag; break; }
  if (best < 0) { let m = Infinity; for (let lag = minLag; lag <= maxLag; lag++) if (dn[lag] < m) { m = dn[lag]; best = lag; } }
  const a = dn[best - 1], b = dn[best], c = dn[best + 1], den = a - 2 * b + c, off = den ? 0.5 * (a - c) / den : 0;
  return sr / (best + off);
}
const cents = (f, ref) => r2(1200 * Math.log2(f / ref));
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function envelope(buf, step = 0.004) {
  const sr = buf.sampleRate, x = buf.getChannelData(0), W = Math.round(step * sr), e = [];
  for (let s = 0; s + W <= x.length; s += W) { let m = 0; for (let i = s; i < s + W; i++) m = Math.max(m, Math.abs(x[i])); e.push(m); }
  return e;
}
if (!only || only === 'checks') {
  const C = out.checks;
  // tuning: plain notes (no vibrato, no gesture) at A3, D4, A4 and a high E5
  C.tuning = {};
  const plain = { vibrato: 0, gesture: 'none', bend: 0, meri: 0, scoop: 0, ornament: 0, muraiki: 0, tremolo: 0, shimmer: 0 };
  for (const id of ['gayageum', 'guzheng', 'koto', 'pipa', 'shamisen', 'erhu', 'haegeum', 'daegeum', 'dizi', 'shakuhachi']) {
    const row = [];
    for (const m of [57, 62, 69, 76]) {
      // bowed strings and flutes have deliberate random pitch jitter: measure their base tuning in Light mode (no jitter)
      const { buf } = await direct(id, plain, [{ p: m, t: 0.02, d: 1.2 }], 1.6, familyOf(id) !== 'pluck');
      row.push(cents(pitchAt(buf, 0.45, 0.08, 60, 1500), mtof(m)));

  // koto ato-oshi: pitch pushed up ~ bend * 2 semitones after the pluck; oshi-hanashi starts high and comes down
  {
    const { buf } = await direct('koto', { gesture: 'ato-oshi', bend: 0.5, vibrato: 0 }, [{ p: 62, t: 0.02, d: 1.5 }], 1.8);
    C.oshide = { before: cents(pitchAt(buf, 0.08), mtof(62)), after: cents(pitchAt(buf, 0.8), mtof(62)) };
    const b2 = (await direct('koto', { gesture: 'oshi-hanashi', bend: 0.5, vibrato: 0 }, [{ p: 62, t: 0.02, d: 1.5 }], 1.8)).buf;

  }

  {
    const { buf } = await direct('gayageum', { gesture: 'chuseong', bend: 0.5, vibrato: 0.7 }, [{ p: 62, t: 0.02, d: 2.5 }], 2.8);

  }

  {
    const { buf } = await direct('shakuhachi', { meri: 0.8, vibrato: 0, muraiki: 0 }, [{ p: 64, t: 0.02, d: 1.6 }], 1.9);

  }
  // erhu legato slide: the second (overlapping) note glides from the first pitch
  {
    const { buf } = await direct('erhu', { vibrato: 0, slide: 0.7 }, [{ p: 62, t: 0.02, d: 1.05 }, { p: 69, t: 1.0, d: 1.2 }], 2.6);
    C.slide = { first: cents(pitchAt(buf, 0.7), mtof(62)), mid: cents(pitchAt(buf, 1.03, 0.03), mtof(69)), landed: cents(pitchAt(buf, 1.7), mtof(69)) };
  }

  {
    const { buf, voices } = await direct('pipa', { tremolo: 0.65 }, [{ p: 64, t: 0.05, d: 2 }], 3.2);
    const e = envelope(buf, 0.004); let on = 0;
    for (let i = 3; i < e.length; i++) { const tt = i * 0.004; if (tt > 0.35 && tt < 2.0 && e[i] > e[i - 3] * 1.35 && e[i] > 0.01) { on++; i += 8; } }

  }

  {
    const ns = []; for (let k = 0; k < 3; k++) for (let i = 0; i < 16; i++) ns.push(N(50 + [0, 2, 4, 7, 9][i % 5] + 12 * Math.floor(i / 5), k * 2 + i * 0.05, 1.2, 0.85));
    const b = await host.render(oneTrack('guzheng', 'mountain-stream', ns, 6, 90), { tailSeconds: 8 });
    C.stress = { ...analyse(b, 5), stats: host.lastRenderStats };
    await host.render(oneTrack('felt', 'felt-upright', ns, 6, 90), { tailSeconds: 8 });   // the engine's own accounting on a round-1 instrument
    C.stress.feltMaxVoices = host.lastRenderStats.maxVoices;
  }
}
window.__result = out;
log('done');
